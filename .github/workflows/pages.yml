name: Data and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poor-man-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Share card tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Refresh data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_data.py
      - name: Commit data snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/og.png
          if git diff --staged --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Update data snapshot"
            git push
          fi
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll LICENSE favicon.svg _site/
          cp -r css js data img _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
